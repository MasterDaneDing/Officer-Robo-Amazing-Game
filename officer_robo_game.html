<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Officer Robo's Amazing Game!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { 
  font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif; 
  background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0d1b3a 100%); 
  color: #fff; margin: 0; padding: 20px; text-align: center; min-height: 100vh;
}
h1, h2, h3 { font-family: 'Luckiest Guy', cursive; text-shadow: 3px 3px 0 #003, 0 0 10px #0ff; letter-spacing: 1px; }
#intro { padding: 40px; }
#intro img { max-width: 70%; border-radius: 20px; box-shadow: 0 0 30px #0ff, 0 0 60px #f0f; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
#board-container { position: relative; width: 900px; max-width: 95%; margin: 20px auto; border-radius: 20px; overflow: hidden; box-shadow: 0 0 40px #00f; }
#board { width: 100%; display: block; }
.token { position: absolute; width: 55px; height: 75px; transition: all 0.6s ease; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
.token img { width: 100%; height: 100%; object-fit: contain; }
#dice-area { margin: 20px; }
.dice { 
  width: 100px; height: 100px; margin: 10px auto; 
  background: linear-gradient(145deg, #fff, #ddd); 
  border-radius: 15px; display: flex; align-items: center; justify-content: center; 
  font-size: 48px; color: #003; font-weight: bold; 
  box-shadow: 0 8px 0 #aaa, 0 0 20px #0ff; 
  transition: transform 0.4s; cursor: pointer;
}
#encounter, #station-msg, #tiebreaker, #winner { 
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
  background: rgba(0,10,30,0.95); z-index: 100; padding: 20px; overflow: auto;
}
#encounter-content, #station-content, #tie-content, #winner-content { max-width: 900px; margin: 0 auto; }
#scene { position: relative; display: inline-block; }
#scene img.scene-img { max-width: 80%; max-height: 40vh; border-radius: 15px; box-shadow: 0 0 20px #ff0; }
#scene img.officer { 
  position: absolute; bottom: 10px; right: 10px; width: 180px; height: auto; 
  filter: drop-shadow(0 5px 10px rgba(0,0,0,0.7)); 
}
#options { margin-top: 20px; }
#options button { 
  display: block; width: 80%; max-width: 500px; margin: 12px auto; 
  padding: 16px 20px; font-size: 18px; font-family: 'Fredoka', sans-serif; font-weight: 600;
  background: linear-gradient(145deg, #1a3a8a, #0a1a4a); color: #fff; 
  border: none; border-radius: 15px; cursor: pointer; 
  box-shadow: 0 5px 0 #003, 0 0 10px #0ff; transition: all 0.2s;
}
#options button:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #003, 0 0 20px #0ff; background: linear-gradient(145deg, #2a5aaa, #1a3a6a); }
#winner img { max-height: 50vh; filter: drop-shadow(0 0 30px #ff0); animation: bounce 1s infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
.controls { margin: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center; }
button { 
  padding: 12px 24px; font-size: 16px; font-family: 'Fredoka', sans-serif; font-weight: 600;
  background: linear-gradient(145deg, #0066cc, #003388); color: white; 
  border: none; border-radius: 12px; cursor: pointer; margin: 5px;
  box-shadow: 0 4px 0 #002, 0 0 8px #0ff; transition: all 0.2s;
}
button:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #002, 0 0 15px #0ff; }
#score-board { 
  position: fixed; top: 15px; right: 15px; background: rgba(0,20,50,0.85); 
  padding: 15px 20px; border-radius: 15px; box-shadow: 0 0 20px #0ff; z-index: 50;
  font-size: 16px; text-align: left; min-width: 180px;
}
#score-board h3 { margin: 0 0 10px 0; font-size: 20px; }
.score-item { margin: 4px 0; }
#char-select { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; }
#char-select .char-card { cursor: pointer; transition: transform 0.2s; }
#char-select .char-card img { 
  width: 140px; height: auto; border-radius: 15px; 
  filter: drop-shadow(0 5px 8px rgba(0,0,0,0.6));
}
#char-select .char-card:hover img { transform: scale(1.08); filter: drop-shadow(0 8px 15px #0ff); }
#char-select .char-card.selected img { filter: drop-shadow(0 0 15px #ff0) drop-shadow(0 5px 8px rgba(0,0,0,0.6)); }
.name-input { margin-top: 8px; padding: 8px; border-radius: 8px; border: 2px solid #0ff; font-family: 'Fredoka', sans-serif; font-size: 14px; width: 140px; background: #112; color: #fff; }
#tie-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; }
.tie-item { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; cursor: pointer; border: 4px solid #0ff; transition: transform 0.1s; }
.tie-item img { width: 100%; height: 100%; object-fit: cover; }
.tie-item:hover { transform: scale(1.1); }
#timer { font-size: 48px; color: #ff0; margin: 10px; }
#player-select-info { font-size: 22px; margin: 15px; color: #ff0; }
</style>
</head>
<body>
<audio id="theme" loop autoplay>
  <source src="Officer Robo.mp3" type="audio/mpeg">
</audio>
<div id="intro">
  <h1>Officer Robo's Amazing Game!</h1>
  <img src="dancing_robots.gif" alt="Dancing Officers" id="dance-gif">
  <br><br>
  <button onclick="startGame()">Start Game</button>
  <button onclick="toggleMusic()">Toggle Music</button>
</div>

<div id="setup" style="display:none;">
  <h2>How many players? (1-4)</h2>
  <button onclick="setPlayers(1)">1 Player</button>
  <button onclick="setPlayers(2)">2 Players</button>
  <button onclick="setPlayers(3)">3 Players</button>
  <button onclick="setPlayers(4)">4 Players</button>
  <div id="player-select-info"></div>
  <div id="char-select"></div>
  <button id="start-btn" style="display:none;" onclick="beginPlay()">Begin Adventure!</button>
</div>

<div id="game" style="display:none;">
  <div id="score-board">
    <h3>Scores</h3>
    <div id="score-list"></div>
  </div>
  <div class="controls">
    <button onclick="toggleMusic()">Music On/Off</button>
    <button onclick="resign()">Resign & Scores</button>
    <span id="current-player" style="font-size:20px; font-weight:bold;"></span>
  </div>
  <div id="board-container">
    <img id="board" src="New_Gameboard.png" alt="Board">
  </div>
  <div id="dice-area">
    <div id="dice" class="dice" onclick="rollDice()">?</div>
    <button onclick="rollDice()">Roll Dice</button>
  </div>
</div>

<div id="encounter">
  <div id="encounter-content">
    <h2>Encounter!</h2>
    <div id="scene"></div>
    <p style="font-size:22px; margin:15px 0;">What should we do?</p>
    <div id="options"></div>
  </div>
</div>

<div id="station-msg">
  <div id="station-content">
    <h2>Back at the Station!</h2>
    <img id="commander-img" src="imagine_images/U3Lcn.jpg" style="max-height:40vh; border-radius:15px;">
    <p id="station-text" style="font-size:24px; margin:20px;"></p>
    <button onclick="closeStation()">Continue!</button>
  </div>
</div>

<div id="tiebreaker">
  <div id="tie-content">
    <h2>Tie-Breaker!</h2>
    <p>Only press the GOOD things! 20 seconds each.</p>
    <div id="timer">20</div>
    <div id="tie-grid"></div>
    <p id="tie-score">Score: 0</p>
  </div>
</div>

<div id="winner">
  <div id="winner-content">
    <h1>Game Over!</h1>
    <img id="winner-img" src="">
    <h2 id="winner-name"></h2>
    <p id="final-scores" style="font-size:20px;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>
const characters = [
  { name: "Officer Robo", img: "Untitled-20260923-143446-1695.png", leave: "imagine_images/q0997.jpg", win: "imagine_images/S8SSQ.jpg", commanderWin: "imagine_images/S8SSQ.jpg" },
  { name: "Pink Officer", img: "Untitled-20260923-143441-0697.png", leave: "imagine_images/ha2F5.jpg", win: "imagine_images/IV5Jh.jpg", commanderWin: "imagine_images/IV5Jh.jpg" },
  { name: "Big Officer", img: "Untitled-20260923-143451-1721.png", leave: "imagine_images/8Vvtl.jpg", win: "imagine_images/RrZX3.jpg", commanderWin: "imagine_images/RrZX3.jpg" },
  { name: "Mustache Officer", img: "Untitled-20260923-143455-2821.png", leave: "imagine_images/DqUuu.jpg", win: "imagine_images/lPeDh.jpg", commanderWin: "imagine_images/lPeDh.jpg" },
  { name: "Ponytail Officer", img: "Untitled-20260923-144649-1634.png", leave: "imagine_images/fqJEZ.jpg", win: "imagine_images/XN2Cq.jpg", commanderWin: "imagine_images/XN2Cq.jpg" }
];

// 30 positions matched to the numbered segments on New Gameboard.png
const squarePos = [
  {x:50, y:15},  // 1 station (top centre)
  {x:56, y:17},  // 2
  {x:62, y:20},  // 3
  {x:68, y:24},  // 4
  {x:74, y:29},  // 5
  {x:79, y:35},  // 6
  {x:82, y:42},  // 7
  {x:83, y:50},  // 8
  {x:81, y:58},  // 9
  {x:77, y:65},  // 10
  {x:71, y:71},  // 11
  {x:64, y:75},  // 12
  {x:56, y:78},  // 13
  {x:48, y:79},  // 14
  {x:40, y:78},  // 15
  {x:33, y:74},  // 16
  {x:27, y:68},  // 17
  {x:23, y:61},  // 18
  {x:21, y:53},  // 19
  {x:21, y:44},  // 20
  {x:23, y:36},  // 21
  {x:27, y:28},  // 22
  {x:33, y:22},  // 23
  {x:40, y:17},  // 24
  {x:48, y:14},  // 25
  {x:56, y:13},  // 26
  {x:63, y:15},  // 27
  {x:69, y:19},  // 28
  {x:74, y:24},  // 29
  {x:78, y:30}   // 30
];

let players = [];
let numPlayers = 1;
let currentPlayer = 0;
let musicOn = true;
let selectingFor = 0;
const theme = document.getElementById('theme');

window.addEventListener('load', () => {
  theme.play().catch(() => {});
});

function startGame() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  theme.play().catch(() => {});
}

function setPlayers(n) {
  numPlayers = n;
  players = [];
  selectingFor = 0;
  for (let i = 0; i < n; i++) {
    players.push({ id: i, char: null, name: '', pos: 1, score: 0, finished: false, lap: 1 });
  }
  document.getElementById('start-btn').style.display = 'none';
  renderCharSelect();
}

function renderCharSelect() {
  const info = document.getElementById('player-select-info');
  info.textContent = `Player ${selectingFor + 1}, choose your character and enter your name:`;
  const div = document.getElementById('char-select');
  div.innerHTML = '';
  characters.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'char-card';
    const img = document.createElement('img');
    img.src = c.img;
    img.alt = c.name;
    card.appendChild(img);
    card.onclick = () => selectChar(i, card);
    div.appendChild(card);
  });
  // Name input area
  const nameDiv = document.createElement('div');
  nameDiv.innerHTML = '<input type="text" id="name-input" class="name-input" placeholder="Enter your name" style="display:none; margin:10px;">';
  div.appendChild(nameDiv);
}

function selectChar(idx, card) {
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  const input = document.getElementById('name-input');
  input.style.display = 'inline-block';
  input.value = '';
  input.focus();
  // Remove previous listeners
  input.onkeydown = null;
  input.onblur = null;
  input.onkeydown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      confirmName(idx);
    }
  };
  // Use button for confirm instead of blur to avoid double-trigger
  if (!document.getElementById('confirm-name-btn')) {
    const btn = document.createElement('button');
    btn.id = 'confirm-name-btn';
    btn.textContent = 'Confirm Name';
    btn.onclick = () => confirmName(idx);
    input.parentNode.appendChild(btn);
  } else {
    document.getElementById('confirm-name-btn').onclick = () => confirmName(idx);
  }
}

function confirmName(charIdx) {
  const input = document.getElementById('name-input');
  if (!input || input.style.display === 'none') return;
  const name = input.value.trim() || `Player ${selectingFor + 1}`;
  if (players[selectingFor].char !== null) return; // already set
  players[selectingFor].char = charIdx;
  players[selectingFor].name = name;
  selectingFor++;
  // Clean up
  const btn = document.getElementById('confirm-name-btn');
  if (btn) btn.remove();
  input.style.display = 'none';
  if (selectingFor < numPlayers) {
    alert(`${name} selected! Next player...`);
    renderCharSelect();
  } else {
    document.getElementById('start-btn').style.display = 'block';
    document.getElementById('player-select-info').textContent = 'All players ready!';
    document.getElementById('char-select').innerHTML = '<p>All set. Click Begin Adventure!</p>';
  }
}

function beginPlay() {
  if (players.some(p => p.char === null)) { 
    alert('All players must select a character and enter a name'); 
    return; 
  }
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  placeTokens();
  updateUI();
  currentPlayer = 0;
  showLeaving(0, true); // true = initial, don't advance turn
}

function placeTokens() {
  const cont = document.getElementById('board-container');
  players.forEach((p, i) => {
    const token = document.createElement('div');
    token.className = 'token';
    token.id = 'token-' + i;
    const img = document.createElement('img');
    img.src = characters[p.char].img;
    token.appendChild(img);
    cont.appendChild(token);
    updateTokenPos(i);
  });
}

function updateTokenPos(i) {
  const token = document.getElementById('token-' + i);
  if (!token) return;
  const posIndex = Math.min(Math.max(players[i].pos - 1, 0), squarePos.length - 1);
  const pos = squarePos[posIndex];
  token.style.left = (pos.x - 3) + '%';
  token.style.top = (pos.y - 5) + '%';
}

function rollDice() {
  const roll = Math.floor(Math.random() * 6) + 1;
  const dice = document.getElementById('dice');
  dice.textContent = roll;
  dice.style.transform = 'rotate(' + (Math.random()*20-10) + 'deg) scale(1.15)';
  setTimeout(() => dice.style.transform = '', 400);
  movePlayer(roll);
}

function movePlayer(steps) {
  const p = players[currentPlayer];
  if (p.finished) { nextTurn(); return; }
  steps = Math.max(1, Math.min(6, steps));
  let remaining = steps;
  let reachedStation = false;

  while (remaining > 0) {
    if (p.pos === 30) {
      // On the last square — next step stops at the station
      p.pos = 1;
      p.lap++;
      reachedStation = true;
      remaining = 0;
      break;
    } else {
      p.pos++;
      remaining--;
    }
  }

  updateTokenPos(currentPlayer);

  setTimeout(() => {
    if (reachedStation && p.lap === 2) {
      players.forEach(pl => { pl.pos = 1; pl.lap = 2; });
      players.forEach((_, i) => updateTokenPos(i));
      showGroupDebrief();
      return;
    }
    if (p.lap > 2) {
      p.finished = true;
      checkEnd();
    } else {
      handleSquare(p.pos);
    }
  }, 700);
}

function showGroupDebrief() {
  const ranks = getRanks();
  let text = "Debriefing! Scores so far:\n\n";
  players.forEach((pl, i) => {
    const rank = ranks[i] || 1;
    const rankText = ['1st','2nd','3rd','4th'][rank-1] || rank + 'th';
    text += `${pl.name}: ${pl.score} points (${rankText})\n`;
  });
  text += "\nGood job everyone! Now go outside again for Round 2!";
  document.getElementById('station-text').textContent = text;
  document.getElementById('commander-img').src = 'imagine_images/U3Lcn.jpg';
  document.getElementById('station-msg').style.display = 'block';
}

function closeStation() {
  document.getElementById('station-msg').style.display = 'none';
  // All players start Round 2 from the station
  nextTurn();
}

function getRanks() {
  const sorted = [...players].map((p,i) => ({...p, orig:i})).sort((a,b) => b.score - a.score);
  const ranks = {};
  sorted.forEach((p, i) => { ranks[p.orig] = i + 1; });
  return ranks;
}

function handleSquare(sq) {
  if (sq === 1) { 
    showLeaving(currentPlayer); 
    return; 
  }
  // Easter egg: exactly 1 in 50 chance
  if (Math.random() < (1/50)) {
    showEasterEgg();
    return;
  }
  let type = 'nice';
  if (sq >= 2 && sq <= 6) type = 'neighbour';
  else if (sq >= 7 && sq <= 11) type = 'train';
  else if (sq >= 12 && sq <= 16) type = 'eating';
  else if (sq >= 17 && sq <= 21) type = 'highway';
  else if (sq >= 22 && sq <= 27) type = 'dangerous';
  else if (sq >= 28 && sq <= 30) type = 'nice';
  const enc = getEncounter(type);
  if (enc) showEncounter(enc);
  else nextTurn();
}

function showEasterEgg() {
  const p = players[currentPlayer];
  p.score += 5;
  alert("Mr. Dane loves you! Get 5 free points!");
  const scene = document.getElementById('scene');
  if (scene) {
    scene.innerHTML = `<img src="sticker_03.webp" style="max-height:40vh; border-radius:15px;" alt="Mr Dane">`;
  }
  document.getElementById('encounter').style.display = 'block';
  setTimeout(() => {
    document.getElementById('encounter').style.display = 'none';
    updateUI();
    nextTurn();
  }, 2500);
}

function showEncounter(enc) {
  const div = document.getElementById('encounter');
  const scene = document.getElementById('scene');
  const officerImg = characters[players[currentPlayer].char].img;
  scene.innerHTML = `
    <img class="scene-img" src="${enc.img}" alt="Scene">
    <img class="officer" src="${officerImg}" alt="Officer">
  `;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  const shuffled = [...enc.options].sort(() => Math.random() - 0.5);
  shuffled.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.onclick = () => answer(opt === enc.correct, enc.correct);
    opts.appendChild(btn);
  });
  div.style.display = 'block';
}

function answer(correct, rightAnswer) {
  if (correct) {
    players[currentPlayer].score++;
    alert("Correct! +1 point.\n" + rightAnswer);
  } else {
    alert("Not quite.\nThe right answer is: " + rightAnswer);
  }
  document.getElementById('encounter').style.display = 'none';
  updateUI();
  nextTurn();
}

function showLeaving(pi, isInitial = false) {
  const p = players[pi];
  alert(`${p.name} (${characters[p.char].name}) is leaving the police station!`);
  if (!isInitial) nextTurn();
}

function nextTurn() {
  currentPlayer = (currentPlayer + 1) % numPlayers;
  let attempts = 0;
  while (players[currentPlayer].finished && attempts < numPlayers) {
    currentPlayer = (currentPlayer + 1) % numPlayers;
    attempts++;
  }
  updateUI();
  if (players.every(p => p.finished || p.lap > 2)) checkEnd();
}

function updateUI() {
  const p = players[currentPlayer];
  document.getElementById('current-player').textContent = 
    p ? `${p.name}'s turn (Lap ${p.lap})` : '';
  const list = document.getElementById('score-list');
  list.innerHTML = players.map((pl, i) => 
    `<div class="score-item">${pl.name || 'Player '+(i+1)}: <strong>${pl.score}</strong></div>`
  ).join('');
}

function checkEnd() {
  if (players.every(p => p.finished || p.lap > 2)) {
    const maxScore = Math.max(...players.map(p => p.score));
    const tied = players.filter(p => p.score === maxScore);
    if (tied.length > 1) {
      startTieBreaker(tied);
    } else {
      showWinner();
    }
  }
}

function startTieBreaker(tiedPlayers) {
  document.getElementById('tiebreaker').style.display = 'block';
  let currentTiePlayer = 0;
  let scores = tiedPlayers.map(() => 0);
  const goods = [
    {img: "imagine_images/orj0J.jpg", good: true},
    {img: "imagine_images/xNrdh.jpg", good: true},
    {img: "imagine_images/9clYj.jpg", good: true},
    {img: "imagine_images/QjKyP.jpg", good: true},
    {img: "imagine_images/8rUp7.jpg", good: true}
  ];
  const bads = [
    {img: "imagine_images/2AzIe.jpg", good: false},
    {img: "imagine_images/1pF7L.jpg", good: false},
    {img: "imagine_images/qPOTP.jpg", good: false},
    {img: "imagine_images/lQNG3.jpg", good: false},
    {img: "imagine_images/ypyJb.jpg", good: false},
    {img: "imagine_images/Qb3x4.jpg", good: false}
  ];
  const allItems = [...goods, ...bads];

  function playRound() {
    if (currentTiePlayer >= tiedPlayers.length) {
      tiedPlayers.forEach((p, i) => p.score += scores[i]);
      document.getElementById('tiebreaker').style.display = 'none';
      showWinner();
      return;
    }
    const p = tiedPlayers[currentTiePlayer];
    document.getElementById('tie-score').textContent = `${p.name}'s score: 0`;
    let time = 20;
    const timerEl = document.getElementById('timer');
    timerEl.textContent = time;
    const grid = document.getElementById('tie-grid');
    grid.innerHTML = '';
    const shown = allItems.sort(() => Math.random()-0.5).slice(0, 8);
    shown.forEach(item => {
      const div = document.createElement('div');
      div.className = 'tie-item';
      const img = document.createElement('img');
      img.src = item.img;
      div.appendChild(img);
      div.onclick = () => {
        if (item.good) {
          scores[currentTiePlayer]++;
          document.getElementById('tie-score').textContent = `${p.name}'s score: ${scores[currentTiePlayer]}`;
          div.style.borderColor = '#0f0';
        } else {
          div.style.borderColor = '#f00';
        }
        div.onclick = null;
      };
      grid.appendChild(div);
    });
    const interval = setInterval(() => {
      time--;
      timerEl.textContent = time;
      if (time <= 0) {
        clearInterval(interval);
        currentTiePlayer++;
        setTimeout(playRound, 1000);
      }
    }, 1000);
  }
  playRound();
}

function showWinner() {
  let max = -1, winner = 0;
  players.forEach((p, i) => { 
    if (p.score > max) { max = p.score; winner = i; } 
  });
  document.getElementById('winner').style.display = 'block';
  document.getElementById('winner-img').src = characters[players[winner].char].commanderWin || characters[players[winner].char].win;
  document.getElementById('winner-name').textContent = 
    `${players[winner].name} wins with ${max} points!`;
  document.getElementById('final-scores').innerHTML = 
    players.map(p => `${p.name}: ${p.score}`).join('<br>');
  document.getElementById('game').style.display = 'none';
}

function resign() {
  showWinner();
}

function toggleMusic() {
  musicOn = !musicOn;
  if (musicOn) theme.play().catch(() => {});
  else theme.pause();
}
